<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Daily Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1 id="app-name">My Daily Tracker</h1>
    <button id="open-settings" class="btn icon">⚙️</button>
  </header>

  <main id="main">
    <section id="dashboard" class="page active">
      <div class="date-row" id="today-date">Loading…</div>
      <div id="cards" class="cards"></div>
      <div id="progress" class="progress"></div>
    </section>

    <section id="food" class="page">
      <h2>Food — Today</h2>
      <form id="food-form" class="inline-form">
        <input type="hidden" id="food-id">
        <select id="food-meal">
          <option>Breakfast</option>
          <option>Lunch</option>
          <option>Snack</option>
          <option>Dinner</option>
          <option>Other</option>
        </select>
        <input id="food-name" placeholder="Food" required>
        <input id="food-qty" type="number" min="0" placeholder="Qty" required>
        <select id="food-unit"><option>g</option><option>ml</option><option>unit</option></select>
        <input id="food-cals" type="number" min="0" placeholder="kcal">
        <button id="add-food" class="btn">Add</button>
      </form>
      <div id="food-list"></div>
    </section>

    <section id="weight" class="page">
      <h2>Weight</h2>
      <form id="weight-form" class="inline-form">
        <input id="weight-date" type="date" required>
        <input id="weight-value" type="number" step="0.1" min="0" placeholder="kg" required>
        <button id="save-weight" class="btn">Save</button>
      </form>
      <div id="weight-list"></div>
    </section>

    <section id="analytics" class="page">
      <h2>Analytics</h2>
      <div class="card">
        <label>Range</label>
        <select id="analytics-range">
          <option value="7d">7 Days</option>
          <option value="30d" selected>30 Days</option>
          <option value="90d">3 Months</option>
          <option value="180d">6 Months</option>
          <option value="365d">1 Year</option>
          <option value="all">All Time</option>
        </select>
        <div id="analytics-output">Loading…</div>
      </div>
    </section>

    <section id="workout" class="page">
      <h2>Workout</h2>
      <form id="workout-form" class="card inline-form">
        <input type="hidden" id="workout-id">
        <input id="workout-date" type="date">
        <select id="workout-type">
          <option>Gym</option><option>Cardio</option><option>Running</option><option>Walking</option><option>Cycling</option><option>Sports</option><option>Rest</option><option>Other</option>
        </select>
        <input id="workout-duration" type="number" min="0" placeholder="minutes">
        <select id="workout-status"><option>Planned</option><option>Completed</option></select>
        <textarea id="workout-notes" placeholder="Notes" rows="2"></textarea>
        <div style="width:100%;display:flex;gap:8px"><button id="add-workout" class="btn">Add</button><button id="reset-workout" class="btn">Reset</button></div>
      </form>
      <div id="workout-list"></div>
    </section>

    <section id="study" class="page">
      <h2>Study</h2>
      <form id="study-form" class="card inline-form">
        <input type="hidden" id="study-id">
        <input id="study-date" type="date">
        <input id="study-subject" placeholder="Subject">
        <input id="study-minutes" type="number" min="0" placeholder="Minutes">
        <input id="study-topic" placeholder="Topic">
        <textarea id="study-notes" placeholder="Notes" rows="2"></textarea>
        <div style="width:100%;display:flex;gap:8px"><button id="add-study" class="btn">Add</button><button id="reset-study" class="btn">Reset</button></div>
      </form>
      <div id="study-summary" class="card">Weekly: — • Monthly: —</div>
      <div id="study-list"></div>
    </section>

    <section id="water" class="page">
      <h2>Water</h2>
      <div class="card inline-form">
        <div style="display:flex;gap:8px">
          <button id="water-add-250" class="btn">+250 ml</button>
          <button id="water-add-500" class="btn">+500 ml</button>
          <button id="water-add-1000" class="btn">+1 L</button>
        </div>
        <form id="water-form" style="margin-top:8px">
          <input id="water-date" type="date">
          <input id="water-ml" type="number" min="0" placeholder="ml">
          <button id="water-save" class="btn">Save</button>
        </form>
      </div>
      <div id="water-list"></div>
    </section>

    <section id="habits" class="page">
      <h2>Habits</h2>
      <form id="habit-form" class="card inline-form">
        <input id="habit-name" placeholder="Habit name">
        <input id="habit-target" type="number" min="0" placeholder="Target frequency">
        <label><input id="habit-active" type="checkbox" checked> Active</label>
        <button id="add-habit" class="btn">Add Habit</button>
      </form>
      <div id="habit-list"></div>
    </section>

    <section id="goals" class="page">
      <h2>Goals</h2>
      <form id="goal-form" class="card inline-form">
        <input type="hidden" id="goal-id">
        <input id="goal-name" placeholder="Goal name">
        <input id="goal-target" placeholder="Target">
        <input id="goal-unit" placeholder="Unit">
        <label><input id="goal-active" type="checkbox" checked> Active</label>
        <button id="add-goal" class="btn">Save Goal</button>
      </form>
      <div id="goals-list"></div>
    </section>

    <section id="steps" class="page">
      <h2>Steps</h2>
      <form id="steps-form" class="card inline-form">
        <input id="steps-date" type="date">
        <input id="steps-value" type="number" min="0" placeholder="Steps">
        <button id="save-steps" class="btn">Save</button>
      </form>
      <div id="steps-list"></div>
    </section>

    <section id="sleep" class="page">
      <h2>Sleep</h2>
      <form id="sleep-form" class="card inline-form">
        <input id="sleep-date" type="date">
        <input id="sleep-minutes" type="number" min="0" placeholder="Minutes asleep">
        <select id="sleep-quality"><option>Good</option><option>Average</option><option>Poor</option></select>
        <textarea id="sleep-notes" placeholder="Notes" rows="2"></textarea>
        <button id="save-sleep" class="btn">Save</button>
      </form>
      <div id="sleep-list"></div>
    </section>

    <section id="notes" class="page">
      <h2>Notes</h2>
      <form id="note-form" class="card inline-form">
        <input id="note-date" type="date">
        <textarea id="note-text" placeholder="Note" rows="3"></textarea>
        <button id="save-note" class="btn">Save</button>
      </form>
      <div id="notes-list"></div>
    </section>

    <section id="calendar" class="page">
      <h2>Calendar</h2>
      <div id="calendar-wrap" class="card"></div>
    </section>

    <section id="daily" class="page">
      <h2 id="daily-title">Daily Detail</h2>
      <div id="daily-detail"></div>
    </section>

    <section id="settings" class="page">
      <h2>Settings</h2>
      <div class="card">
        <label>Application name</label>
        <input id="setting-app-name" type="text">
        <label>API URL (Apps Script Web App)</label>
        <input id="setting-api-url" type="url">
        <button id="save-settings" class="btn">Save Settings</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-section="dashboard">🏠</button>
    <button data-section="food">🍗</button>
    <button data-section="weight">⚖️</button>
    <button data-section="workout">🏋️</button>
    <button data-section="analytics">📊</button>
    <button data-section="settings">⚙️</button>
  </nav>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/food.js"></script>
  <script src="js/weight.js"></script>
  <script src="js/workout.js"></script>
  <script src="js/study.js"></script>
  <script src="js/water.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/steps.js"></script>
  <script src="js/sleep.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/debug.js"></script>
</body>
</html>
